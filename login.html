<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Dominus Auto</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <div class="logo-area">
            <img src="assets/logo.jpg" alt="Dominus Auto">
        </div>
        <nav>
            <a href="home.html">Home</a>
            <a href="veiculos.html">Veículos</a>
            <a href="suporte.html">Suporte</a>
            <a href="sobre.html">Sobre Nós</a>
            <a href="login.html" class="btn-header">Fazer Login</a>
            <div class="user-avatar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="#a0a0a0"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
        </nav>
    </header>

    <main class="login-wrapper">
        <section class="login-form-side">
            <h1 class="brand-title">DOMINUS AUTO</h1>
            <h2 class="welcome-text">BemVindo(a)!</h2>

            <form class="login-form">
                <div class="form-group">
                    <label for="email">Email:</label>
                    <div class="input-container">
                        <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                        <input type="email" id="email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="senha">Senha:</label>
                    <div class="input-container">
                        <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input type="password" id="senha" required>
                        <svg class="toggle-password" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Entrar na sua conta</button>

                <div class="forgot-link">
                    <a href="esqueci-senha.html">Esqueceu a sua senha?</a>
                </div>

                <div class="signup-row">
                    <span>Ainda nao possui uma conta?</span>
                    <a href="cadastro.html">Cadastre-se</a>
                </div>
            </form>
        </section>

        <section class="login-image-side"></section>
    </main>

</body>
</html>
